<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | NovaTech</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body class="auth-page">


<div class="auth-box">

<a href="index.html"
class="logo">
<span>N</span>
NovaTech
</a>


<h1>
Welcome Back
</h1>

<p>
Login to your account
</p>


<form id="loginForm">

<label>Email</label>

<input
type="email"
id="loginEmail"
placeholder="Enter email"
required>


<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter password"
required>


<button
type="submit"
class="btn btn-primary">

Login

</button>

</form>


<p class="auth-bottom">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</p>


<a href="index.html"
class="back-home">
← Back to website
</a>

</div>


<script src="js/auth.js"></script>

</body>
</html>
