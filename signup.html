<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up | NovaTech</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body class="auth-page">


<div class="auth-box">

<a href="index.html"
class="logo">
<span>N</span>
NovaTech
</a>


<h1>
Create Account
</h1>

<p>
Join NovaTech today
</p>


<form id="signupForm">

<label>
Full Name
</label>

<input
type="text"
id="signupName"
placeholder="Your name"
required>


<label>
Email
</label>

<input
type="email"
id="signupEmail"
placeholder="Your email"
required>


<label>
Password
</label>

<input
type="password"
id="signupPassword"
placeholder="Create password"
required>


<label>
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>


<button
type="submit"
class="btn btn-primary">

Create Account

</button>

</form>


<p class="auth-bottom">

Already have an account?

<a href="login.html">
Login
</a>

</p>


<a href="index.html"
class="back-home">
← Back to website
</a>

</div>


<script src="js/auth.js"></script>

</body>
</html>
